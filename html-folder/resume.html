<!DOCTYPE html>
<html>
<head>
    <title>Simple Timetable</title>
    <style>
        table {
            width: 80%;
            border-collapse: collapse;
            margin: 20px auto;
            text-align: center;
        }
        th, td {
            border: 1px solid black;
            padding: 10px;
        }
        th {
            background-color: #f2f2f2;
        }
        caption {
            font-size: 24px;
            margin: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<table>
    <caption>My Class Timetable</caption>
    <tr>
        <th>Day</th>
        <th>9-10</th>
        <th>10-11</th>
        <th>11-12</th>
        <th>12-1</th>
        <th>1-2</th>
    </tr>

    <tr>
        <td>Monday</td>
        <td>Software Engineering</td>
        <td>DA</td>
        <td>CN</td>
        <td>Break</td>
        <td>COI</td>
    </tr>

    <tr>
        <td>Tuesday</td>
        <td>DA</td>
        <td>Software Engineering</td>
        <td>COI</td>
        <td>Break</td>
        <td>CN</td>
    </tr>

    <tr>
        <td>Wednesday</td>
        <td>CN</td>
        <td>COI</td>
        <td>Software Engineering</td>
        <td>Break</td>
        <td>DA</td>
    </tr>

    <tr>
        <td>Thursday</td>
        <td>COI</td>
        <td>CN</td>
        <td>DA</td>
        <td>Break</td>
        <td>Software Engineering</td>
    </tr>

    <tr>
        <td>Friday</td>
        <td>Software Engineering</td>
        <td>CN</td>
        <td>DA</td>
        <td>Break</td>
        <td>COI</td>
    </tr>

</table>

</body>
</html>
